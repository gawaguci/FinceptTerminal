# Codex CLI 프로젝트 설정 (계획서 7장)
# 작업 단위는 작게 분리하고, 테스트 없는 코드 생성을 금지한다.

[project]
name = "kiwoom-stock-signal"
description = "키움 OpenAPI+ 기반 실시간 종목발굴 및 매수타이밍 알림 프로그램"

# Codex가 인식할 테스트 명령
[commands]
test = "cd signal-engine-java && mvn test"
build = "cd signal-engine-java && mvn -q package"

# 안전 규칙
[rules]
order_default_disabled = true     # 주문 기본값은 항상 비활성
no_secret_in_repo = true          # 민감정보 커밋 금지
require_tests = true              # Java 비즈니스 로직은 JUnit 테스트 동반
no_live_order_test = true         # 실계좌 주문 테스트 금지
